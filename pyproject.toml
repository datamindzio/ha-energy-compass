[project]
name = "ha-energy-compass"
version = "0.1.34"
requires-python = ">=3.14.2"
dependencies = [
    "scipy==1.18.1",
]

[project.optional-dependencies]
test = [
    "pytest-homeassistant-custom-component==0.13.364",
    "ruff==0.16.8",
    "jsonschema==4.23.0",
    "pytest-timeout==2.4.0",
]
docs = [
    "markdown==3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["replan_cooldown: run with the shipped minimum_replan_seconds default"]
# Slowest test measured at 10.02s (test_real_sink_thread_stops_within_its_bound_despite_a_hanging_transport[10]);
# 45s gives >=3x headroom. method=thread: hangs in monkeypatched compute() run on
# hass's executor thread, not just the main test thread, so the signal-based
# default cannot interrupt them.
timeout = 45
timeout_method = "thread"

[tool.ruff]
# Vendored verbatim from edge/atlas_sink (energy-atlas ADR-0019 §10); linted there.
extend-exclude = ["custom_components/energy_compass/atlas_sink"]
