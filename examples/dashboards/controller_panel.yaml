# Generated by tools/dashboards/build.py - do not edit; edit the generator and rebuild.
type: grid
column_span: 2
cards:
- type: heading
  heading: Battery
  heading_style: title
  icon: mdi:home-battery
- type: conditional
  grid_options:
    columns: 24
    rows: auto
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity: binary_sensor.replace_with_forecast_valid
      state_not: 'on'
    - condition: state
      entity: binary_sensor.replace_with_alert
      state: 'on'
    - condition: and
      conditions:
      - condition: state
        entity: select.energy_compass_deye_mode
        state: Auto
      - condition: state
        entity: sensor.energy_compass_deye_controller_runtime
        state_not: ok
  card:
    type: markdown
    title: Check control
    content: '{% set labels = {''CHARGE_PV'':''Charging from PV'',''CHARGE_GRID'':''Charging from grid'',''DISCHARGE_GRID'':''Selling
      to grid'',''SELF_CONSUME'':''Powering the house'',''HOLD'':''Holding'',''CURTAIL'':''Holding (PV curtailment)'',''BASE'':''Base
      mode''} %}

      {% set colors = {''CHARGE_PV'':''🟢'',''CHARGE_GRID'':''🔵'',''DISCHARGE_GRID'':''🟠'',''SELF_CONSUME'':''🟣'',''HOLD'':''⚪'',''CURTAIL'':''⚪'',''BASE'':''⚪''}
      %}

      {% set rt = state_attr(''sensor.energy_compass_deye_controller_runtime'',''runtime'') or {} %}

      {% set plan = ''sensor.replace_with_plan'' %}

      {% set valid = is_state(''binary_sensor.replace_with_forecast_valid'',''on'') and as_timestamp(state_attr(plan,''valid_until''),0)
      > as_timestamp(now()) %}

      {% set fresh = as_timestamp(rt.get(''original_deadline''),0) > as_timestamp(now()) and as_timestamp(rt.get(''last_confirmation''),0)
      > 0 %}

      {% if not valid %}⚠️ The forecast is not current. The schedule is not a current recommendation.{% endif %}

      {% if is_state(''binary_sensor.replace_with_alert'',''on'') %}

      ⚠️ {{ state_attr(''binary_sensor.replace_with_alert'',''reason'') or ''The Compass reports a problem.'' }}

      {% endif %}

      {% if is_state(''select.energy_compass_deye_mode'',''Auto'') %}

      {% if rt.get(''code'') != ''ok'' %}⚠️ Controller: {{ rt.get(''reason'') or rt.get(''code'') or ''No data'' }}{% endif
      %}

      {% if not fresh %}⚠️ No fresh confirmation of the inverter settings.{% endif %}

      {% if rt.get(''uncertain'') %}⚠️ Unconfirmed writes: {{ rt.get(''uncertain'')|length }}.{% endif %}

      {% if rt.get(''warning'') %}⚠️ {{ rt.warning }}{% endif %}

      {% endif %}'
    grid_options:
      columns: 24
      rows: auto
- type: vertical-stack
  grid_options:
    columns: 12
    rows: auto
  cards:
  - type: horizontal-stack
    cards:
    - type: tile
      entity: sensor.replace_with_battery_soc
      name: Charge
      color: green
    - type: tile
      entity: sensor.replace_with_battery_power
      name: Battery power
      color: purple
  - type: markdown
    title: Battery now
    content: '{% set labels = {''CHARGE_PV'':''Charging from PV'',''CHARGE_GRID'':''Charging from grid'',''DISCHARGE_GRID'':''Selling
      to grid'',''SELF_CONSUME'':''Powering the house'',''HOLD'':''Holding'',''CURTAIL'':''Holding (PV curtailment)'',''BASE'':''Base
      mode''} %}

      {% set colors = {''CHARGE_PV'':''🟢'',''CHARGE_GRID'':''🔵'',''DISCHARGE_GRID'':''🟠'',''SELF_CONSUME'':''🟣'',''HOLD'':''⚪'',''CURTAIL'':''⚪'',''BASE'':''⚪''}
      %}

      {% set rt = state_attr(''sensor.energy_compass_deye_controller_runtime'',''runtime'') or {} %}

      {% set plan = ''sensor.replace_with_plan'' %}

      {% set valid = is_state(''binary_sensor.replace_with_forecast_valid'',''on'') and as_timestamp(state_attr(plan,''valid_until''),0)
      > as_timestamp(now()) %}

      {% set fresh = as_timestamp(rt.get(''original_deadline''),0) > as_timestamp(now()) and as_timestamp(rt.get(''last_confirmation''),0)
      > 0 %}

      {% set power = states(''sensor.replace_with_battery_power'') %}

      {% if is_number(power) %}

      **{{ ''Discharging'' if power|float > 50 else ''Charging'' if power|float < -50 else ''Idle'' }} · {{ (power|float|abs
      / 1000)|round(2) }} kW**

      {% else %}

      No current power reading.

      {% endif %}


      Control: **{{ {''Auto'':''Automatic'',''Simulation'':''Simulation'',''Off'':''Off''}.get(states(''select.energy_compass_deye_mode''),''Unavailable'')
      }}**


      {% if is_state(''select.energy_compass_deye_mode'',''Auto'') and fresh and rt.get(''code'') == ''ok'' and not rt.get(''uncertain'')
      %}

      Settings confirmed: **{{ labels.get(rt.get(''confirmed_mode''),''No mode confirmation'') }}**

      {% else %}

      Controller status: **{{ rt.get(''reason'') or rt.get(''code'') or ''No data'' }}**

      {% endif %}'
    grid_options:
      columns: 12
      rows: auto
  - type: tile
    entity: select.energy_compass_deye_mode
    name: Control mode
    icon: mdi:compass
    features:
    - type: select-options
- type: markdown
  title: Compass decision
  content: '{% set labels = {''CHARGE_PV'':''Charging from PV'',''CHARGE_GRID'':''Charging from grid'',''DISCHARGE_GRID'':''Selling
    to grid'',''SELF_CONSUME'':''Powering the house'',''HOLD'':''Holding'',''CURTAIL'':''Holding (PV curtailment)'',''BASE'':''Base
    mode''} %}

    {% set colors = {''CHARGE_PV'':''🟢'',''CHARGE_GRID'':''🔵'',''DISCHARGE_GRID'':''🟠'',''SELF_CONSUME'':''🟣'',''HOLD'':''⚪'',''CURTAIL'':''⚪'',''BASE'':''⚪''}
    %}

    {% set rt = state_attr(''sensor.energy_compass_deye_controller_runtime'',''runtime'') or {} %}

    {% set plan = ''sensor.replace_with_plan'' %}

    {% set valid = is_state(''binary_sensor.replace_with_forecast_valid'',''on'') and as_timestamp(state_attr(plan,''valid_until''),0)
    > as_timestamp(now()) %}

    {% set fresh = as_timestamp(rt.get(''original_deadline''),0) > as_timestamp(now()) and as_timestamp(rt.get(''last_confirmation''),0)
    > 0 %}

    {% set mode = states(''sensor.replace_with_energy_compass'') %}

    {% if valid %}

    ### {{ colors.get(mode,''⚪'') }} {{ labels.get(mode,''No recommendation'') }}

    {% set ns = namespace(row=none) %}

    {% for row in state_attr(plan,''intervals'') or [] %}

    {% if as_timestamp(row.start,0) <= as_timestamp(now()) < as_timestamp(row.end,0) %}{% set ns.row = row %}{% endif %}

    {% endfor %}

    {% if ns.row %}

    Current segment until **{{ as_local(as_datetime(ns.row.end)).strftime(''%H:%M'') }}**.

    {% endif %}

    {% else %}

    **No current recommendation.** The plan expired or the forecast is unavailable.

    {% endif %}


    {% set n = rt.get(''active_tou'',0)|int %}

    {% set confirmed = rt.get(''confirmed'') or {} %}

    {% set prefix = state_attr(''sensor.energy_compass_deye_controller'',''program_prefix'') or '''' %}

    {% set target = confirmed.get(''number.'' ~ prefix ~ n ~ ''_soc'') %}

    {% if is_state(''select.energy_compass_deye_mode'',''Auto'') and fresh and rt.get(''code'') == ''ok'' and not rt.get(''uncertain'')
    and target is not none %}

    {{ ''SOC target'' if rt.get(''confirmed_mode'') == ''CHARGE_GRID'' else ''SOC floor'' }} of the controller: **{{ target|round(0)|int
    }}%**

    {% endif %}


    {% if valid %}

    {% set ns = namespace(next=none) %}

    {% for row in state_attr(plan,''intervals'') or [] %}

    {% if not ns.next and as_timestamp(row.start,0) > as_timestamp(now()) and row.state != mode %}{% set ns.next = row %}{%
    endif %}

    {% endfor %}

    {% if ns.next %}

    Then: **{{ labels.get(ns.next.state,ns.next.state) }}**, {{ as_local(as_datetime(ns.next.start)).strftime(''%d.%m %H:%M'')
    }}.

    {% endif %}

    {% endif %}


    Power shows what the battery actually does. The recommendation and confirmation refer to the plan and the settings.'
  grid_options:
    columns: 12
    rows: auto
- type: heading
  heading: Battery plan
  heading_style: subtitle
  icon: mdi:chart-timeline-variant
- type: markdown
  title: Next 24 hours
  content: '{% set labels = {''CHARGE_PV'':''Charging from PV'',''CHARGE_GRID'':''Charging from grid'',''DISCHARGE_GRID'':''Selling
    to grid'',''SELF_CONSUME'':''Powering the house'',''HOLD'':''Holding'',''CURTAIL'':''Holding (PV curtailment)'',''BASE'':''Base
    mode''} %}

    {% set colors = {''CHARGE_PV'':''🟢'',''CHARGE_GRID'':''🔵'',''DISCHARGE_GRID'':''🟠'',''SELF_CONSUME'':''🟣'',''HOLD'':''⚪'',''CURTAIL'':''⚪'',''BASE'':''⚪''}
    %}

    {% set rt = state_attr(''sensor.energy_compass_deye_controller_runtime'',''runtime'') or {} %}

    {% set plan = ''sensor.replace_with_plan'' %}

    {% set valid = is_state(''binary_sensor.replace_with_forecast_valid'',''on'') and as_timestamp(state_attr(plan,''valid_until''),0)
    > as_timestamp(now()) %}

    {% set fresh = as_timestamp(rt.get(''original_deadline''),0) > as_timestamp(now()) and as_timestamp(rt.get(''last_confirmation''),0)
    > 0 %}

    {% if valid %}

    {% set ns = namespace(rows=[], start=none, end=none, mode=none, soc=none) %}

    {% for r in state_attr(plan,''intervals'') or [] %}

    {% if as_timestamp(r.end,0) > as_timestamp(now()) and as_timestamp(r.start,0) < as_timestamp(now())+86400 %}

    {% if ns.mode != r.state %}

    {% if ns.mode is not none %}{% set ns.rows = ns.rows + [{''start'':ns.start,''end'':ns.end,''mode'':ns.mode,''soc'':ns.soc}]
    %}{% endif %}

    {% set ns.start = r.start %}{% set ns.mode = r.state %}

    {% endif %}

    {% set ns.end = r.end %}{% set ns.soc = r.end_soc_kwh %}

    {% endif %}

    {% endfor %}

    {% if ns.mode is not none %}{% set ns.rows = ns.rows + [{''start'':ns.start,''end'':ns.end,''mode'':ns.mode,''soc'':ns.soc}]
    %}{% endif %}

    | From | Battery plan | SOC at the end |

    |:--|:--|--:|

    {% for r in ns.rows %}| {{ ''Now'' if as_timestamp(r.start,0) <= as_timestamp(now()) else as_local(as_datetime(r.start)).strftime(''%d.%m
    %H:%M'') }} | {{ colors.get(r.mode,''⚪'') }} {{ labels.get(r.mode,r.mode) }} | {{ (r.soc|float / 25 * 100)|round(0)|int
    }}% |

    {% endfor %}


    The plan can change after new measurements. SOC is computed for the configured 25 kWh.

    {% else %}

    Schedule unavailable - waiting for a current forecast.

    {% endif %}'
  grid_options:
    columns: 12
    rows: auto
- type: custom:apexcharts-card
  grid_options:
    columns: 12
    rows: auto
  header:
    show: true
    title: Charge forecast · 24 h
  graph_span: 24h
  span:
    start: minute
  update_interval: 1min
  now:
    show: true
    label: Now
  hours_12: false
  yaxis:
  - min: 0
    max: 100
    decimals: 0
  apex_config:
    chart:
      height: 260
      toolbar:
        show: false
    legend:
      show: false
    xaxis:
      labels:
        datetimeUTC: false
    tooltip:
      x:
        format: dd.MM HH:mm
  series:
  - entity: sensor.replace_with_plan
    name: SOC forecast
    unit: '%'
    type: area
    color: '#43a047'
    opacity: 0.15
    stroke_width: 2
    curve: straight
    extend_to: false
    float_precision: 0
    data_generator: 'const a = entity.attributes, now = Date.now();

      if (hass.states[''binary_sensor.replace_with_forecast_valid'']?.state !== ''on'' || !(Date.parse(a.valid_until) > now))
      return [];

      const rows = (a.intervals || []).filter(r => Date.parse(r.end) > now && Date.parse(r.end) <= now + 86400000);

      const points = rows.map(r => [Date.parse(r.end), Math.max(0, Math.min(100, Number(r.end_soc_kwh) / 25 * 100))]);

      const soc = hass.states[''sensor.replace_with_battery_soc''];

      const reported = Date.parse(soc?.attributes?.reported_at ?? soc?.last_updated);

      if (soc && Number.isFinite(Number(soc.state)) && now - reported < 90000) points.unshift([now, Number(soc.state)]);

      return points;'
- type: markdown
  title: Household consumption compass
  content: '{% set labels = {''CHARGE_PV'':''Charging from PV'',''CHARGE_GRID'':''Charging from grid'',''DISCHARGE_GRID'':''Selling
    to grid'',''SELF_CONSUME'':''Powering the house'',''HOLD'':''Holding'',''CURTAIL'':''Holding (PV curtailment)'',''BASE'':''Base
    mode''} %}

    {% set colors = {''CHARGE_PV'':''🟢'',''CHARGE_GRID'':''🔵'',''DISCHARGE_GRID'':''🟠'',''SELF_CONSUME'':''🟣'',''HOLD'':''⚪'',''CURTAIL'':''⚪'',''BASE'':''⚪''}
    %}

    {% set rt = state_attr(''sensor.energy_compass_deye_controller_runtime'',''runtime'') or {} %}

    {% set plan = ''sensor.replace_with_plan'' %}

    {% set valid = is_state(''binary_sensor.replace_with_forecast_valid'',''on'') and as_timestamp(state_attr(plan,''valid_until''),0)
    > as_timestamp(now()) %}

    {% set fresh = as_timestamp(rt.get(''original_deadline''),0) > as_timestamp(now()) and as_timestamp(rt.get(''last_confirmation''),0)
    > 0 %}

    {% if valid %}

    {% set level = states(''sensor.replace_with_consumer_compass'') %}

    {% set cost = states(''sensor.replace_with_consumption_cost'') %}

    **{{ {''BOOST'':''🟢 Use more'',''CHEAP'':''🟢 Cheap use'',''NORMAL'':''⚪ Normal use'',''LIMIT'':''🔴 Limit use''}.get(level,''No
    recommendation'') }}**

    {% if is_number(cost) %} · {{ cost|float|round(3) }} PLN/kWh of extra use{% endif %}


    {% set change = states(''sensor.replace_with_next_change'') %}

    {% if as_timestamp(change,0) > as_timestamp(now()) %}

    Next change: **{{ {''BOOST'':''use more'',''CHEAP'':''cheap use'',''NORMAL'':''normal use'',''LIMIT'':''limit use''}.get(state_attr(''sensor.replace_with_next_change'',''next_level''),''No
    data'') }}**, {{ as_local(as_datetime(change)).strftime(''%d.%m %H:%M'') }}.

    {% endif %}


    Estimated cost of extra energy used in the house, with the battery taken into account. This is not the grid purchase price.

    {% else %}

    No consumption hint - no current forecast.

    {% endif %}'
  grid_options:
    columns: 24
    rows: auto
