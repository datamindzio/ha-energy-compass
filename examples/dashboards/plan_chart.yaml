  series:
  - entity: sensor.replace_with_load_power
    name: Load
    color: '#42a5f5'
    type: line
    yaxis_id: power
    unit: kW
    float_precision: 2
    stroke_width: 2
    curve: monotoneCubic
    extend_to: now
    fill_raw: 'null'
    transform: 'if (x === null || x === '''') return null; const v = Number(x); return Number.isFinite(v) ? v / 1000 : null;'
    group_by:
      func: avg
      duration: 30min
      fill: last
    show:
      legend_value: false
