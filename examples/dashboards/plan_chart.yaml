type: grid
column_span: 4
cards:
- type: heading
  heading: Energy Compass
  heading_style: title
  icon: mdi:chart-timeline-variant
- type: custom:apexcharts-card
  section_mode: true
  grid_options:
    columns: full
    rows: 9
  header:
    show: true
    title: Load / Grid / PV / SoC - history and plan
    show_states: true
    colorize_states: true
  graph_span: 36h
  span:
    offset: +24h
  update_interval: 1min
  hours_12: false
  now:
    show: true
    label: Now
    color: '#9e9e9e'
  show:
    last_updated: true
  yaxis:
  - id: power
    decimals: 1
    min: ~0
    max: ~0
    apex_config:
      tickAmount: 6
      title:
        text: Power [kW]
  - id: soc
    opposite: true
    min: 0
    max: 100
    decimals: 0
    apex_config:
      tickAmount: 5
      title:
        text: SoC [%]
