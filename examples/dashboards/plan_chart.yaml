  - entity: sensor.replace_with_plan
    name: Load · plan
    color: '#42a5f5'
    type: line
    yaxis_id: power
    unit: kW
    float_precision: 2
    stroke_width: 2
    stroke_dash: 6
    curve: monotoneCubic
    extend_to: false
    show:
      in_header: false
      legend_value: false
    data_generator: "const now = Date.now();\nconst valid = hass.states['binary_sensor.replace_with_forecast_valid'];\n//\
      \ The integration retains the last complete generation while its replacement runs.\nconst refreshing = entity.attributes.refreshing\
      \ === true;\nif (['unknown', 'unavailable'].includes(entity.state) ||\n    (!refreshing && (valid?.state !== 'on' ||\n\
      \      !(Date.parse(entity.attributes.valid_until) > now)))) return [];\nconst rows = (entity.attributes.intervals ||\
      \ []).filter(r =>\n  Number.isFinite(Date.parse(r.start)) && Number.isFinite(Date.parse(r.end)) &&\n  Date.parse(r.end)\
      \ > Date.parse(r.start) && Date.parse(r.end) > now\n).sort((a, b) => Date.parse(a.start) - Date.parse(b.start));\nconst\
      \ points = [];\nlet previousEnd = null;\nlet previousValue = null;\nfor (const r of rows) {\n  const from = Date.parse(r.start),\
      \ to = Date.parse(r.end);\n  const value = (Number.isFinite(r.load_kwh)) ? (r.load_kwh) / ((to - from) / 3600000) :\
      \ null;\n  // Clip the first slot at now, but divide by its original duration.\n  const left = Math.max(from, now);\n\
      \  if (previousEnd !== null && from > previousEnd) {\n    points.push([previousEnd, previousValue], [previousEnd + 1,\
      \ null]);\n  }\n  points.push([left, value]);\n  previousEnd = to;\n  previousValue = value;\n}\nif (previousEnd !==\
      \ null) points.push([previousEnd, previousValue]);\nreturn points;\n"
