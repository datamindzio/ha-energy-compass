- type: markdown
  grid_options:
    columns: full
    rows: auto
  content: '**Solid lines:** measurements up to now · **Dashed:** Energy Compass plan from now.

    12 h history (power and SoC: 30 min means) + 24 h ahead. **Grid:** + import / − export. Plan SoC: capacity 25 kWh.


    **Background (14% opacity):** CHARGE_PV yellow · CHARGE_GRID red · DISCHARGE_GRID purple · SELF_CONSUME green.

    HOLD and other states gray. Narrow intervals: hover for the label.

    CHARGE_GRID and DISCHARGE_GRID labels add the block''s mean buy / sell price, weighted by planned grid energy.


    {% set valid = ''binary_sensor.replace_with_forecast_valid'' %}

    {% set plan = ''sensor.replace_with_plan'' %}

    {% set until = state_attr(plan, ''valid_until'') %}

    {% if has_value(plan) and state_attr(plan, ''refreshing'') == true %}

    **Recalculating - showing the previous plan. The new one replaces it automatically.**

    {% elif is_state(valid, ''on'') and until and as_timestamp(until, 0) > as_timestamp(now()) %}

    {% set coverage = state_attr(valid, ''coverage_end'') %}

    {% if coverage %}Plan available until **{{ as_local(as_datetime(coverage)).strftime(''%d.%m %H:%M'') }}**.{% endif %}

    {% if not state_attr(valid, ''coverage_complete'') %} The rest stays empty - forecasts do not cover it completely.{% endif
    %}

    {% else %}

    **Forecast stale or unavailable - only measured history is shown.**

    {% endif %}

    '
