# Generated by tools/dashboards/build.py - do not edit; edit the generator and rebuild.
type: grid
cards:
- type: heading
  heading: Energy Compass diagnostics
  heading_style: title
  icon: mdi:wrench-outline
- type: markdown
  title: Energy Compass diagnostics
  content: '{% set labels = {''CHARGE_PV'':''Charging from PV'',''CHARGE_GRID'':''Charging from grid'',''DISCHARGE_GRID'':''Selling
    to grid'',''SELF_CONSUME'':''Powering the house'',''HOLD'':''Holding'',''CURTAIL'':''Holding (PV curtailment)'',''BASE'':''Base
    mode''} %}

    {% set colors = {''CHARGE_PV'':''🟢'',''CHARGE_GRID'':''🔵'',''DISCHARGE_GRID'':''🟠'',''SELF_CONSUME'':''🟣'',''HOLD'':''⚪'',''CURTAIL'':''⚪'',''BASE'':''⚪''}
    %}

    {% set rt = state_attr(''sensor.energy_compass_deye_controller_runtime'',''runtime'') or {} %}

    {% set plan = ''sensor.replace_with_plan'' %}

    {% set valid = is_state(''binary_sensor.replace_with_forecast_valid'',''on'') and as_timestamp(state_attr(plan,''valid_until''),0)
    > as_timestamp(now()) %}

    {% set fresh = as_timestamp(rt.get(''original_deadline''),0) > as_timestamp(now()) and as_timestamp(rt.get(''last_confirmation''),0)
    > 0 %}

    | Parameter | State |

    |:--|:--|

    | Optimizer | {{ states(''sensor.replace_with_optimizer_status'') }} |

    | Controller | {{ rt.get(''code'',''No data'') }} |

    | Reason | {{ rt.get(''reason'',''—'') }} |

    | Confirmed mode | {{ labels.get(rt.get(''confirmed_mode''),rt.get(''confirmed_mode'',''—'')) }} |

    | Last confirmation | {{ as_local(as_datetime(rt.get(''last_confirmation''))).strftime(''%d.%m %H:%M:%S'') if as_timestamp(rt.get(''last_confirmation''),0)
    else ''None'' }} |

    | Plan created | {{ as_local(as_datetime(state_attr(plan,''generated_at''))).strftime(''%d.%m %H:%M:%S'') if as_timestamp(state_attr(plan,''generated_at''),0)
    else ''None'' }} |

    | Controller plan valid until | {{ as_local(as_datetime(rt.get(''original_deadline''))).strftime(''%d.%m %H:%M:%S'') if
    as_timestamp(rt.get(''original_deadline''),0) else ''None'' }} |

    | Forecast until | {{ as_local(as_datetime(state_attr(''binary_sensor.replace_with_forecast_valid'',''coverage_end''))).strftime(''%d.%m
    %H:%M'') if as_timestamp(state_attr(''binary_sensor.replace_with_forecast_valid'',''coverage_end''),0) else ''None'' }}
    |

    | Active TOU program | {{ rt.get(''active_tou'',''—'') }} |

    | Unconfirmed writes | {{ rt.get(''uncertain'',[])|length }} |

    | Controller session | {{ state_attr(''sensor.energy_compass_deye_controller'',''session'') }} |

    | Restore after the session | {{ state_attr(''sensor.energy_compass_deye_controller_runtime'',''restore_pending'') }}
    |


    {% if rt.get(''warning'') %}⚠️ {{ rt.warning }}{% endif %}


    {% if state_attr(plan,''reasons'') %}Model notes: {{ state_attr(plan,''reasons'')|join('', '') }}.{% endif %}


    The restore flag can be on during an Auto session. On its own it does not mean a fault.'
