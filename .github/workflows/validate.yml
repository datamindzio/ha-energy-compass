name: Validate Energy Compass

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build Home Assistant 2026.9.1 test image
        run: docker build --file Dockerfile.test --tag ha-energy-compass-test:2026.9.1 .
      - name: Test
        run: docker run --rm -v "$PWD:/workspace:ro" ha-energy-compass-test:2026.9.1 -m pytest -p no:cacheprovider -q
      - name: Check generated files
        run: |
          docker run --rm -v "$PWD:/workspace:ro" ha-energy-compass-test:2026.9.1 tools/deye_controller/build.py --check
          docker run --rm -v "$PWD:/workspace:ro" ha-energy-compass-test:2026.9.1 tools/dashboards/build.py --check
          docker run --rm -v "$PWD:/workspace:ro" ha-energy-compass-test:2026.9.1 tools/build_builder.py --check
      - name: Lint
        run: docker run --rm -v "$PWD:/workspace:ro" ha-energy-compass-test:2026.9.1 -m ruff check --no-cache .
      - name: Check formatting
        run: docker run --rm -v "$PWD:/workspace:ro" ha-energy-compass-test:2026.9.1 -m ruff format --check --no-cache .
      - name: Check dependencies
        run: docker run --rm ha-energy-compass-test:2026.9.1 -m pip check

  cards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test the cost card (Node built-in test runner)
        working-directory: cards/cost
        run: node --test test-*.mjs
      - name: Test the dashboard state bands (Node built-in test runner)
        working-directory: tools/dashboards
        run: node --test test-*.mjs

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate integration manifest and translations
        run: docker run --rm -v "$PWD:/github/workspace:ro" ghcr.io/home-assistant/hassfest@sha256:d13ffcc8995c1217804fe355ed078a81d3028b7002355bc5d89d19d9075d63c7

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate pushed repository revision
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_CATEGORY: integration
          INPUT_COMMENT: "false"
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker run --rm -e INPUT_GITHUB_TOKEN -e INPUT_CATEGORY -e INPUT_COMMENT -e REPOSITORY -e REPOSITORY_REF ghcr.io/hacs/action@sha256:dc92fdad2f6ffbe74bffb7269d781ea8e064f52d9bb486cdf3925d74e7ab6ebf
